
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routing Lookup</title>
<link rel="stylesheet" href="styles.css">

<style>
.routing-content {
    background: #f5f5f5;
    min-height: calc(100vh - 80px);
    padding: 45px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.routing-panel {
    width: 100%;
    max-width: 600px;
    background: white;
    border: 3px solid #333;
    border-radius: 8px;
    padding: 40px;
    color: #333;
}

.routing-panel h2 {
    font-size: 23px;
    text-align: center;
    margin-bottom: 35px;
}

.routing-label {
    display: block;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 12px;
}

.routing-input {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    border: 2px solid #333;
    border-radius: 5px;
    margin-bottom: 20px;
    outline: none;
    color: #333;
    background: white;
}

.routing-input:focus {
    border-color: #4CAF50;
}

.routing-button {
    width: 100%;
    padding: 15px;
    background: transparent;
    color: #333;
    border: 2px solid #333;
    border-radius: 5px;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
}

.routing-button:hover {
    background: #333;
    color: white;
}

.routing-button:disabled {
    opacity: 0.5;
    cursor: wait;
}

.routing-results {
    margin-top: 25px;
    line-height: 1.6;
    color: #333;
}

.routing-results:empty {
    display: none;
}

.routing-card {
    padding: 22px;
    background: #f8f9fa;
    border: 2px solid #333;
    border-radius: 6px;
}

.routing-card h3 {
    margin-bottom: 15px;
    font-size: 21px;
}

.routing-card p {
    margin: 9px 0;
    font-size: 15px;
}

.routing-card .routing-button {
    margin-top: 20px;
    font-size: 14px;
}

.routing-message {
    text-align: center;
    font-size: 15px;
    color: #666;
}

.routing-error {
    color: #c62828;
}

.routing-history-btn {
    background: none;
    border: none;
    color: #4CAF50;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    padding: 10px 15px;
    letter-spacing: 1px;
}

.routing-history-btn:hover {
    color: #81c784;
}

/* HISTORY POPUP */

.routing-history-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    padding: 5vh 15px;
    overflow-y: auto;
    background: rgba(0,0,0,0.55);
}

.routing-history-modal.show {
    display: block;
}

.routing-history-content {
    width: 100%;
    max-width: 900px;
    margin: auto;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 5px 25px rgba(0,0,0,0.3);
}

.routing-history-header {
    background: #333;
    color: white;
    padding: 25px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.routing-history-header h3 {
    font-size: 20px;
    letter-spacing: 1px;
}

.routing-close-btn {
    background: none;
    border: none;
    color: white;
    font-size: 30px;
    cursor: pointer;
}

.routing-history-body {
    padding: 25px;
    max-height: 65vh;
    overflow: auto;
    color: #333;
}

.routing-history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
}

.routing-history-table th {
    background: #f5f5f5;
    padding: 14px;
    text-align: left;
    border-bottom: 2px solid #ddd;
}

.routing-history-table td {
    padding: 14px;
    border-bottom: 1px solid #e5e5e5;
    color: #666;
}

.routing-history-table tr:hover {
    background: #f9f9f9;
}

.routing-no-history {
    text-align: center;
    padding: 30px;
    color: #666;
}

@media(max-width: 768px) {
    .routing-panel {
        padding: 25px 20px;
    }

    .routing-panel h2 {
        font-size: 20px;
    }

    .routing-history-btn {
        font-size: 13px;
        padding: 8px;
    }

    .routing-history-header {
        padding: 20px;
    }

    .routing-history-body {
        padding: 12px;
    }

    .routing-history-table {
        min-width: 500px;
        font-size: 13px;
    }

    .routing-history-table th,
    .routing-history-table td {
        padding: 10px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <button class="home-btn"
        onclick="window.location.href='index.html'"
        aria-label="Home">

        <svg class="home-icon" viewBox="0 0 24 24">
            <path d="M10 20V14H14V20H19V12H22L12 3 2 12H5V20H10Z"/>
        </svg>
    </button>

    <h1 class="page-title">Routing Lookup</h1>

    <button
        class="routing-history-btn"
        id="open-history"
        type="button">
        HISTORY
    </button>

</header>

<!-- MAIN SEARCH -->

<main class="routing-content">

<section class="routing-panel">

    <h2>US Routing Number Lookup</h2>

    <form id="routing-form">

        <label class="routing-label" for="routing-input">
            Routing Number
        </label>

        <input
            id="routing-input"
            class="routing-input"
            type="text"
            inputmode="numeric"
            maxlength="9"
            placeholder="Enter 9-digit routing number"
            autocomplete="off"
            required
        >

        <button
            id="search-button"
            class="routing-button"
            type="submit">
            SEARCH
        </button>

    </form>

    <div
        id="routing-results"
        class="routing-results"
        aria-live="polite">
    </div>

</section>
</main>

<!-- HISTORY MODAL -->

<div
    id="routing-history-modal"
    class="routing-history-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="history-title">

    <div class="routing-history-content">

        <div class="routing-history-header">

            <h3 id="history-title">
                SEARCH HISTORY
            </h3>

            <button
                class="routing-close-btn"
                id="close-history"
                type="button"
                aria-label="Close history">
                &times;
            </button>

        </div>

        <div class="routing-history-body">

            <table class="routing-history-table">

                <thead>
                    <tr>
                        <th>Routing Number</th>
                        <th>Bank</th>
                        <th>State</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="routing-history-list">
                </tbody>

            </table>

            <div
                id="routing-no-history"
                class="routing-no-history"
                style="display:none;">
                No search history yet.
            </div>

        </div>
    </div>
</div>

<script>
"use strict";

/* CONFIGURATION */

const API_BASE = "https://bankrouting.io/api/v1/aba/";
const STORAGE_KEY = "routingLookupHistoryV1";

const form = document.getElementById("routing-form");
const input = document.getElementById("routing-input");
const results = document.getElementById("routing-results");
const searchButton = document.getElementById("search-button");

const historyModal =
    document.getElementById("routing-history-modal");

const historyList =
    document.getElementById("routing-history-list");

const noHistory =
    document.getElementById("routing-no-history");

const openHistory =
    document.getElementById("open-history");

const closeHistory =
    document.getElementById("close-history");

let previousFocus = null;

/* VALIDATE ABA CHECKSUM */

function validateRoutingNumber(number) {
    if (!/^\d{9}$/.test(number)) return false;

    const d = number.split("").map(Number);

    const sum =
        3 * (d[0] + d[3] + d[6]) +
        7 * (d[1] + d[4] + d[7]) +
        (d[2] + d[5] + d[8]);

    return sum % 10 === 0;
}

/* SAFE TEXT DISPLAY */

function addText(parent, tag, value) {
    const element = document.createElement(tag);
    element.textContent = String(value);
    parent.appendChild(element);
    return element;
}

function showMessage(message, isError = false) {
    results.replaceChildren();

    const element = addText(results, "p", message);

    element.className = isError
        ? "routing-message routing-error"
        : "routing-message";
}

/* HISTORY STORAGE */

function getHistory() {
    try {
        const stored = localStorage.getItem(STORAGE_KEY);
        const data = stored ? JSON.parse(stored) : [];

        return Array.isArray(data) ? data : [];
    } catch {
        return [];
    }
}

function saveHistory(bank) {
    const history = getHistory();

    const entry = {
        routing_number: bank.routing_number,
        bank: bank.bank_name,
        state: bank.state,
        date: new Date().toLocaleDateString("en-CA")
    };

    const updated = history.filter(item =>
        item.routing_number !== entry.routing_number
    );

    updated.unshift(entry);

    try {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(updated.slice(0, 100))
        );
    } catch {
        // Browser storage may be unavailable.
    }
}

function displayHistory() {
    const history = getHistory();

    historyList.replaceChildren();

    noHistory.style.display =
        history.length ? "none" : "block";

    history.forEach(item => {
        const row = document.createElement("tr");

        addText(row, "td", item.routing_number || "—");
        addText(row, "td", item.bank || "—");
        addText(row, "td", item.state || "—");
        addText(row, "td", item.date || "—");

        historyList.appendChild(row);
    });
}

/* HISTORY MODAL */

function showHistory() {
    previousFocus = document.activeElement;

    displayHistory();
    historyModal.classList.add("show");
    closeHistory.focus();
}

function hideHistory() {
    historyModal.classList.remove("show");

    if (previousFocus) previousFocus.focus();
}

openHistory.addEventListener("click", showHistory);
closeHistory.addEventListener("click", hideHistory);

historyModal.addEventListener("click", event => {
    if (event.target === historyModal) hideHistory();
});

document.addEventListener("keydown", event => {
    if (!historyModal.classList.contains("show")) return;

    if (event.key === "Escape") {
        hideHistory();
    }

    if (event.key === "Tab") {
        event.preventDefault();
        closeHistory.focus();
    }
});

/* COPY BUTTON */

function createCopyButton(parent, number) {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "routing-button";
    button.textContent = "COPY ROUTING NUMBER";

    button.addEventListener("click", async () => {
        try {
            await navigator.clipboard.writeText(number);
            button.textContent = "COPIED!";
        } catch {
            button.textContent = "COPY UNAVAILABLE";
        }
    });

    parent.appendChild(button);
}

/* DISPLAY BANK */

function displayBank(bank) {
    results.replaceChildren();

    const card = document.createElement("div");
    card.className = "routing-card";

    addText(card, "h3", bank.bank_name);

    addText(
        card,
        "p",
        "Routing Number: " + bank.routing_number
    );

    addText(
        card,
        "p",
        "City: " + (bank.city || "—")
    );

    addText(
        card,
        "p",
        "State: " + (bank.state || "—")
    );

    createCopyButton(card, bank.routing_number);

    results.appendChild(card);
}

/* LIVE BANK LOOKUP */

async function lookupRoutingNumber(number) {
    const controller = new AbortController();

    const timeout = setTimeout(() => {
        controller.abort();
    }, 12000);

    try {
        const response = await fetch(
            API_BASE + encodeURIComponent(number),
            {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                },
                signal: controller.signal
            }
        );

        if (response.status === 404) {
            throw new Error("Bank not found.");
        }

        if (response.status === 429) {
            throw new Error(
                "Too many requests. Please try again later."
            );
        }

        if (response.status === 400) {
            throw new Error("Invalid routing number.");
        }

        if (!response.ok) {
            throw new Error(
                "Bank lookup is temporarily unavailable."
            );
        }

        const result = await response.json();

        if (
            result.status !== "success" ||
            !result.data ||
            typeof result.data.bank_name !== "string" ||
            !result.data.bank_name.trim() ||
            String(result.data.aba_number) !== number
        ) {
            throw new Error(
                "No matching bank information was returned."
            );
        }

        return {
            routing_number: number,
            bank_name: result.data.bank_name.trim(),
            city: String(result.data.city || "").trim(),
            state: String(result.data.state || "").trim()
        };

    } finally {
        clearTimeout(timeout);
    }
}

/* SEARCH */

form.addEventListener("submit", async event => {
    event.preventDefault();

    const number = input.value.trim();

    results.replaceChildren();

    if (!/^\d{9}$/.test(number)) {
        showMessage(
            "Enter a valid 9-digit routing number.",
            true
        );
        return;
    }

    if (!validateRoutingNumber(number)) {
        showMessage("Invalid routing number.", true);
        return;
    }

    searchButton.disabled = true;
    searchButton.textContent = "SEARCHING...";

    try {
        const bank = await lookupRoutingNumber(number);

        displayBank(bank);
        saveHistory(bank);

    } catch (error) {
        if (error.name === "AbortError") {
            showMessage(
                "Request timed out. Please try again.",
                true
            );
        } else if (error instanceof TypeError) {
            showMessage(
                "Unable to connect to the bank lookup service. " +
                "The API may be unavailable or may block browser requests.",
                true
            );
        } else {
            showMessage(
                error.message || "Lookup failed.",
                true
            );
        }

    } finally {
        searchButton.disabled = false;
        searchButton.textContent = "SEARCH";
    }
});
</script>

</body>
</html>
