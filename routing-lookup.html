
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routing Lookup</title>
<link rel="stylesheet" href="styles.css">

<style>
* { box-sizing: border-box; }

.routing-content {
    background: #f5f5f5;
    min-height: calc(100vh - 80px);
    padding: 45px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.routing-panel {
    width: 100%;
    max-width: 600px;
    background: white;
    border: 3px solid #333;
    border-radius: 8px;
    padding: 40px;
    color: #333;
}

.routing-panel h2 {
    font-size: 23px;
    text-align: center;
    margin: 0 0 35px;
}

.routing-label {
    display: block;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 12px;
}

.routing-input {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    border: 2px solid #333;
    border-radius: 5px;
    margin-bottom: 20px;
    outline: none;
    background: white;
    color: #333;
}

.routing-input:focus {
    border-color: #4CAF50;
}

.routing-button {
    width: 100%;
    padding: 15px;
    background: transparent;
    color: #333;
    border: 2px solid #333;
    border-radius: 5px;
    font-size: 17px;
    cursor: pointer;
    transition: .2s;
}

.routing-button:hover:not(:disabled) {
    background: #333;
    color: white;
}

.routing-button:disabled {
    opacity: .55;
    cursor: wait;
}

.routing-results {
    margin-top: 25px;
    color: #333;
    line-height: 1.6;
}

.routing-results:empty { display: none; }

.routing-card {
    background: #f8f9fa;
    border: 2px solid #333;
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 15px;
    overflow-wrap: anywhere;
}

.routing-card h3 {
    font-size: 20px;
    margin: 0 0 15px;
}

.routing-card p {
    font-size: 15px;
    margin: 8px 0;
}

.routing-card .routing-button {
    font-size: 14px;
    margin-top: 15px;
}

.routing-number {
    color: #65a45e;
    font-weight: bold;
    letter-spacing: 1px;
}

.routing-status {
    margin-top: 12px;
    font-size: 13px;
    color: #666;
}

.routing-message {
    text-align: center;
    font-size: 15px;
    color: #666;
}

.routing-error { color: #c62828; }

.routing-result-count {
    margin-bottom: 18px;
    font-size: 14px;
    color: #666;
    text-align: center;
}

.routing-load-more { margin-top: 10px; }

/* HEADER HISTORY BUTTON */

.routing-history-btn {
    background: none;
    border: none;
    color: #65a45e;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    padding: 10px 15px;
    letter-spacing: 1px;
}

.routing-history-btn:hover { color: #81c784; }

/* HISTORY MODAL */

.routing-history-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    padding: 5vh 15px;
    overflow-y: auto;
    background: rgba(0,0,0,.55);
}

.routing-history-modal.show { display: block; }

.routing-history-content {
    width: 100%;
    max-width: 900px;
    margin: auto;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 5px 25px rgba(0,0,0,.3);
}

.routing-history-header {
    background: #333;
    color: white;
    padding: 25px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.routing-history-header h3 {
    font-size: 20px;
    letter-spacing: 1px;
    margin: 0;
}

.routing-close-btn {
    background: none;
    border: none;
    color: white;
    font-size: 30px;
    cursor: pointer;
}

.routing-history-body {
    padding: 25px;
    max-height: 65vh;
    overflow: auto;
    color: #333;
}

.routing-history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
}

.routing-history-table th {
    background: #f5f5f5;
    padding: 14px;
    text-align: left;
    border-bottom: 2px solid #ddd;
}

.routing-history-table td {
    padding: 14px;
    border-bottom: 1px solid #e5e5e5;
    color: #666;
}

.routing-history-table tbody tr:hover {
    background: #f9f9f9;
}

.routing-no-history {
    text-align: center;
    padding: 30px;
    color: #666;
}

@media(max-width: 768px) {
    .routing-panel { padding: 25px 20px; }
    .routing-panel h2 { font-size: 20px; }
    .routing-history-btn {
        font-size: 13px;
        padding: 8px;
    }
    .routing-history-header { padding: 20px; }
    .routing-history-header h3 { font-size: 17px; }
    .routing-history-body { padding: 12px; }
    .routing-history-table {
        min-width: 500px;
        font-size: 13px;
    }
    .routing-history-table th,
    .routing-history-table td { padding: 10px; }
}
</style>
</head>

<body>

<header class="header">
    <button
        class="home-btn"
        type="button"
        onclick="window.location.href='index.html'"
        aria-label="Home">

        <svg class="home-icon" viewBox="0 0 24 24">
            <path d="M10 20V14H14V20H19V12H22L12 3 2 12H5V20H10Z"/>
        </svg>
    </button>

    <h1 class="page-title">Routing Lookup</h1>

    <button
        class="routing-history-btn"
        id="open-history"
        type="button">
        HISTORY
    </button>
</header>

<main class="routing-content">
    <section class="routing-panel">
        <h2>US Routing Number Lookup</h2>

        <form id="routing-form">
            <label class="routing-label" for="routing-input">
                Bank Name, City or Routing Number
            </label>

            <input
                id="routing-input"
                class="routing-input"
                type="text"
                maxlength="100"
                placeholder="Enter bank name, city or routing number"
                autocomplete="off"
                spellcheck="false"
                required
            >

            <button
                id="search-button"
                class="routing-button"
                type="submit">
                SEARCH
            </button>
        </form>

        <div
            id="routing-results"
            class="routing-results"
            aria-live="polite">
        </div>
    </section>
</main>

<!-- HISTORY -->

<div
    id="routing-history-modal"
    class="routing-history-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="history-title">

    <div class="routing-history-content">
        <div class="routing-history-header">
            <h3 id="history-title">SEARCH HISTORY</h3>

            <button
                class="routing-close-btn"
                id="close-history"
                type="button"
                aria-label="Close history">
                &times;
            </button>
        </div>

        <div class="routing-history-body">
            <table class="routing-history-table">
                <thead>
                    <tr>
                        <th>Routing Number</th>
                        <th>Bank</th>
                        <th>State</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="routing-history-list"></tbody>
            </table>

            <div
                id="routing-no-history"
                class="routing-no-history"
                style="display:none;">
                No search history yet.
            </div>
        </div>
    </div>
</div>

<script>
"use strict";

/* CONFIGURATION */

const DATABASE_URL = "US-TOOLS/BANK-INFO/routing-data.json";
const STORAGE_KEY = "routingLookupHistoryV1";
const RESULTS_PER_PAGE = 50;
const MAX_HISTORY = 100;

/* ELEMENTS */

const form = document.getElementById("routing-form");
const input = document.getElementById("routing-input");
const results = document.getElementById("routing-results");
const searchButton = document.getElementById("search-button");
const historyModal = document.getElementById("routing-history-modal");
const historyList = document.getElementById("routing-history-list");
const noHistory = document.getElementById("routing-no-history");
const openHistory = document.getElementById("open-history");
const closeHistory = document.getElementById("close-history");

let routingDatabase = null;
let databasePromise = null;
let currentMatches = [];
let displayedCount = 0;
let previousFocus = null;

/* DATABASE LOADER */

async function loadDatabase() {
    if (routingDatabase) return routingDatabase;
    if (databasePromise) return databasePromise;

    databasePromise = (async () => {
        const response = await fetch(DATABASE_URL);

        if (!response.ok) {
            throw new Error("Database HTTP " + response.status);
        }

        const data = await response.json();

        if (!data || !Array.isArray(data.records)) {
            throw new Error("Invalid database format");
        }

        routingDatabase = data.records;
        return routingDatabase;
    })();

    try {
        return await databasePromise;
    } catch (error) {
        databasePromise = null;
        throw error;
    }
}

/* ABA VALIDATION */

function validateRoutingNumber(number) {
    if (!/^\d{9}$/.test(number)) return false;

    const d = number.split("").map(Number);

    const sum =
        3 * (d[0] + d[3] + d[6]) +
        7 * (d[1] + d[4] + d[7]) +
        (d[2] + d[5] + d[8]);

    return sum % 10 === 0;
}

/* SAFE TEXT */

function addText(parent, tag, value) {
    const element = document.createElement(tag);
    element.textContent = String(value ?? "");
    parent.appendChild(element);
    return element;
}

function showMessage(message, isError = false) {
    results.replaceChildren();

    const element = addText(results, "p", message);
    element.className = isError
        ? "routing-message routing-error"
        : "routing-message";
}

/* NORMALIZE BANK */

function normalizeBank(record) {
    const ach = record.ach || {};
    const wire = record.fedwire || {};

    return {
        routing_number: String(record.routingNumber || ""),
        bank_name:
            record.bankName ||
            ach.bankName ||
            wire.bankName ||
            "Unknown Bank",
        city:
            record.city ||
            ach.city ||
            wire.city ||
            "",
        state:
            record.state ||
            ach.state ||
            wire.state ||
            "",
        ach_name: ach.bankName || "",
        fedwire_name: wire.bankName || "",
        supports_ach: Boolean(record.supportsACH),
        listed_in_fedwire: Boolean(record.listedInFedwire)
    };
}

/* SEARCH BY ROUTING NUMBER, BANK OR CITY */

function searchDatabase(query) {
    const term = query.trim().toLowerCase();
    const exactRouting = /^\d{9}$/.test(term);
    const matches = [];

    for (const record of routingDatabase) {
        const number = String(record.routingNumber || "");

        if (exactRouting) {
            if (number === term) matches.push(record);
            continue;
        }

        const fields = [
            record.bankName,
            record.city,
            record.state,
            record.ach?.bankName,
            record.ach?.city,
            record.ach?.state,
            record.fedwire?.bankName,
            record.fedwire?.city,
            record.fedwire?.state
        ];

        const fieldMatch = fields.some(value =>
            String(value || "").toLowerCase().includes(term)
        );

        if (fieldMatch || number.includes(term)) {
            matches.push(record);
        }
    }

    return matches;
}

/* HISTORY */

function getHistory() {
    try {
        const data = JSON.parse(
            localStorage.getItem(STORAGE_KEY) || "[]"
        );
        return Array.isArray(data) ? data : [];
    } catch {
        return [];
    }
}

/*
 Save all matching records in one operation.
 Preserve old entries and update duplicates.
*/

function saveSearchHistory(records) {
    if (!records.length) return;

    const oldHistory = getHistory();
    const today = new Date().toLocaleDateString("en-CA");

    const newEntries = [];
    const seen = new Set();

    for (const record of records) {
        const bank = normalizeBank(record);
        const number = bank.routing_number;

        if (!/^\d{9}$/.test(number) || seen.has(number)) {
            continue;
        }

        seen.add(number);

        newEntries.push({
            routing_number: number,
            bank: bank.bank_name,
            state: bank.state || "—",
            date: today
        });
    }

    const remainingOld = oldHistory.filter(item =>
        !seen.has(item.routing_number)
    );

    const combined = [
        ...newEntries,
        ...remainingOld
    ].slice(0, MAX_HISTORY);

    try {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(combined)
        );
    } catch (error) {
        console.warn("History could not be saved", error);
    }
}

/* HISTORY DISPLAY */

function displayHistory() {
    const history = getHistory();

    historyList.replaceChildren();
    noHistory.style.display =
        history.length ? "none" : "block";

    history.forEach(item => {
        const row = document.createElement("tr");

        addText(row, "td", item.routing_number || "—");
        addText(row, "td", item.bank || "—");
        addText(row, "td", item.state || "—");
        addText(row, "td", item.date || "—");

        historyList.appendChild(row);
    });
}

/* HISTORY MODAL */

function showHistory() {
    previousFocus = document.activeElement;
    displayHistory();
    historyModal.classList.add("show");
    closeHistory.focus();
}

function hideHistory() {
    historyModal.classList.remove("show");
    if (previousFocus) previousFocus.focus();
}

openHistory.addEventListener("click", showHistory);
closeHistory.addEventListener("click", hideHistory);

historyModal.addEventListener("click", event => {
    if (event.target === historyModal) hideHistory();
});

document.addEventListener("keydown", event => {
    if (!historyModal.classList.contains("show")) return;

    if (event.key === "Escape") {
        hideHistory();
    }

    if (event.key === "Tab") {
        event.preventDefault();
        closeHistory.focus();
    }
});

/* COPY ROUTING NUMBER */

function createCopyButton(parent, number) {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "routing-button";
    button.textContent = "COPY ROUTING NUMBER";

    button.addEventListener("click", async () => {
        try {
            await navigator.clipboard.writeText(number);
            button.textContent = "COPIED!";

            setTimeout(() => {
                button.textContent = "COPY ROUTING NUMBER";
            }, 2000);
        } catch {
            button.textContent = "COPY UNAVAILABLE";
        }
    });

    parent.appendChild(button);
}

/* BANK RESULT */

function displayBank(record) {
    const bank = normalizeBank(record);
    const card = document.createElement("div");

    card.className = "routing-card";

    addText(card, "h3", bank.bank_name);

    const routing = addText(
        card, "p",
        "Routing Number: " + bank.routing_number
    );

    routing.className = "routing-number";

    addText(card, "p", "City: " + (bank.city || "—"));
    addText(card, "p", "State: " + (bank.state || "—"));

    addText(
        card, "p",
        "ACH Directory: " +
        (bank.supports_ach ? "Listed" : "Not listed")
    );

    addText(
        card, "p",
        "Fedwire Directory: " +
        (bank.listed_in_fedwire ? "Listed" : "Not listed")
    );

    if (
        bank.ach_name &&
        bank.fedwire_name &&
        bank.ach_name !== bank.fedwire_name
    ) {
        addText(
            card, "p",
            "ACH Bank Name: " + bank.ach_name
        );

        addText(
            card, "p",
            "Fedwire Bank Name: " + bank.fedwire_name
        );
    }

    const note = addText(
        card, "p",
        "Historical directory record"
    );

    note.className = "routing-status";

    createCopyButton(card, bank.routing_number);
    results.appendChild(card);
}

/* SHOW MORE RESULTS */

function displayNextResults() {
    const oldButton =
        document.getElementById("routing-load-more");

    if (oldButton) oldButton.remove();

    const next = currentMatches.slice(
        displayedCount,
        displayedCount + RESULTS_PER_PAGE
    );

    next.forEach(displayBank);
    displayedCount += next.length;

    if (displayedCount < currentMatches.length) {
        const button = document.createElement("button");

        button.id = "routing-load-more";
        button.type = "button";
        button.className =
            "routing-button routing-load-more";

        button.textContent =
            "SHOW MORE (" +
            (currentMatches.length - displayedCount) +
            " REMAINING)";

        button.addEventListener(
            "click", displayNextResults
        );

        results.appendChild(button);
    }
}

function displayMatches(matches) {
    results.replaceChildren();

    currentMatches = matches;
    displayedCount = 0;

    if (!matches.length) {
        showMessage("No matching bank found.");
        return;
    }

    if (matches.length > 1) {
        const count = addText(
            results, "p",
            matches.length + " matching records found."
        );

        count.className = "routing-result-count";
    }

    displayNextResults();
}

/* MAIN SEARCH */

form.addEventListener("submit", async event => {
    event.preventDefault();

    const search = input.value.trim();

    if (!search) return;

    if (/^\d{9}$/.test(search) &&
        !validateRoutingNumber(search)) {
        showMessage("Invalid routing number.", true);
        return;
    }

    searchButton.disabled = true;
    searchButton.textContent = "SEARCHING...";

    try {
        await loadDatabase();

        const matches = searchDatabase(search);

        displayMatches(matches);

        /*
         Automatically save every matching record,
         whether searched by routing number,
         bank name, city or state.
        */
        if (matches.length) {
            saveSearchHistory(matches);
        }

    } catch (error) {
        console.error("Routing database error:", error);

        showMessage(
            "Unable to load routing database. " +
            "Check the JSON file location.",
            true
        );
    } finally {
        searchButton.disabled = false;
        searchButton.textContent = "SEARCH";
    }
});

</script>
</body>
</html>
